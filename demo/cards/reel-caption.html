<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="reel.css"><style>
html, body { background: transparent; height: auto; }
.top { width: 1080px; height: 480px; padding: 110px 72px 0; display: flex; flex-direction: column; gap: 18px; }

.title { font-size: 68px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; white-space: pre-line; color: var(--ink); }

<div class="top" id="top"><div class="eyebrow">Braid</div><div class="title" id="title"></div></div>
<div class="bottom" id="bottom"><img src="../../public/brand/braid-wordmark-light.svg" alt="Braid"><div class="url">braid.monarc.workers.dev</div></div>
